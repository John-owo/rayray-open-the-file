<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RayRay, Open the File!</title>
<style>
:root{--ink:#151f28;--window:#dddcc7;--teal:#124c51;--navy:#192a55;--mint:#aaf1ca;--edge:#17252d}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:repeating-linear-gradient(0deg,#124c51 0 4px,#155258 4px 8px);font:17px/1.5 Consolas,"Courier New",monospace}
main{max-width:1050px;margin:auto;padding:clamp(12px,4vw,48px)}
.desktop{background:var(--window);border:3px solid var(--edge);box-shadow:6px 6px 0 #0c292c}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--navy);color:#fff;font-weight:bold}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px dashed #006b71;outline-offset:3px}
header button:focus-visible{outline-color:var(--mint)}
#reset,.close{color:var(--ink);background:#eeecd9;border:2px solid var(--edge);box-shadow:2px 2px 0 var(--edge);padding:4px 10px}
.content{padding:clamp(15px,4vw,36px)}
.hero{display:flex;align-items:center;gap:clamp(10px,3vw,30px)}
.avatar{width:clamp(76px,18vw,178px);height:auto;flex:none;image-rendering:pixelated;animation:idle 1.4s steps(2,end) infinite}
@keyframes idle{50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.avatar{animation:none}}
.kicker,small{font-weight:bold;color:#095157}
h1{font-size:clamp(26px,5.5vw,56px);letter-spacing:-.055em;line-height:1.02;margin:6px 0 12px}
p{margin:0 0 12px}
.note{background:#ffec9d;border:2px solid var(--edge);box-shadow:3px 3px 0 #79754f;padding:10px 12px;margin:22px 0 17px}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,195px),1fr));gap:12px}
.file{text-align:left;min-height:82px;background:#f2f0df;border:2px solid var(--edge);box-shadow:3px 3px 0 #7a8374;padding:9px 11px}
.file:hover{background:#c9eed6}
.file:active,#reset:active,.close:active{transform:translate(2px,2px);box-shadow:none}
.file b{display:block;font-size:16px}
.file-icon{display:block;width:24px;height:28px;margin-bottom:6px;background:#f4cd63;border:3px solid var(--edge);position:relative}
.file-icon::after{content:"";position:absolute;top:8px;left:3px;width:12px;height:2px;background:var(--ink);box-shadow:0 5px 0 var(--ink)}
footer{padding:10px 12px;border-top:2px solid var(--edge);background:#cacbb8;font-size:15px}
dialog{width:min(500px,calc(100% - 32px));padding:19px;border:3px solid var(--edge);box-shadow:6px 6px 0 #071e20;background:var(--window);color:var(--ink)}
dialog::backdrop{background:#061d21a8}
dialog h2{margin:8px 0;font-size:25px}

.hero{gap:12px}.avatar{width:clamp(65px,13vw,112px)}.content{padding:clamp(14px,3vw,28px)}
.file{min-height:74px}.file small{display:block;font-size:13px}
.progress{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.progress span{padding:2px 7px;border:2px solid var(--edge);background:#f2f0df;font-size:13px}
.progress .done{background:#aaf1ca}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.actions button{padding:7px 10px;border:2px solid var(--edge);background:#ffec9d;box-shadow:2px 2px 0 var(--edge)}
.actions:empty{display:none}
#file-message{white-space:pre-line}
#feedback{font-weight:bold;color:#095157}
#feedback:empty{display:none}
</style>

<div><div class="kicker">CASE 01 / FILE MYSTERY</div><h1>RayRay,<br>Open the File!</h1><p>Finish three repairs. Unlock the exam record.</p></div>
</div>
<p class="note"><strong>Sticky note</strong> &nbsp; The exam record is locked. Fix the laptop, check the tablet, and start keyboard mode.</p>
<div class="progress" aria-label="Case tasks">
<span id="task-laptop">○ Laptop</span><span id="task-tablet">○ Tablet</span><span id="task-mouse">○ Keyboard</span>
</div><div class="files">
<button class="file" data-file="laptop"><span class="file-icon" aria-hidden="true"></span><b>Laptop.sys</b><small>Missing screw</small></button>
<button class="file" data-file="tablet"><span class="file-icon" aria-hidden="true"></span><b>Tablet.log</b><small>Screen check</small></button>
<button class="file" data-file="mouse"><span class="file-icon" aria-hidden="true"></span><b>Mouse.cfg</b><small>Keyboard mode</small></button>
<button class="file" data-file="sim"><span class="file-icon" aria-hidden="true"></span><b>Dad_SIM.txt</b></button>
<button class="file" data-file="log"><span class="file-icon" aria-hidden="true"></span><b>Ctrl_Z.log</b></button>
<button class="file" data-file="record"><span class="file-icon" aria-hidden="true"></span><b>Exam_Record.txt</b><small id="lock">Locked</small></button>
</div>
</div>
<footer id="status" role="status">Ready · Select a file to open it</footer>
</section>
</main>
<dialog aria-labelledby="file-title">
<small id="file-name"></small>
<h2 id="file-title"></h2>
<p id="file-message"></p>
<p id="translation" hidden>RayRay, come here!</p>
<div class="actions"></div><p id="feedback" role="status"></p><form method="dialog"><button class="close" autofocus>Back to desktop</button></form>
</dialog>
<script>
const tasks = {
  laptop: {
    name:"Laptop", title:"The case fell off!", intro:"RayRay asked AI, 'Why is my laptop fan so loud?' AI said, 'Take off the bottom cover and check the fan.'\n\nHe took out the screws and set them next to his pencil. When he put the laptop back together, one screw was missing. As soon as he picked it up, the bottom cover fell off.\n\nHe remembers hearing a tiny metal clink under the desk. Where should he look?",
    options:[["Check the desk","Just the pencil. The clink came from below."],["Look under the desk","You found the screw next to a desk leg and secured the bottom cover.",true],["Check the laptop bag","Only the charger."]],
  },
  tablet: {
    name:"Tablet", title:"Tablet dropped!", intro:"RayRay played on his tablet during the exam and dropped it. Pick the first step before trying to play again.",
    options:[["Launch the game","First check whether the tablet still works."],["Check the screen","The display lights up and responds. Tablet checked.",true],["Turn up the volume","That will not tell you whether the display works."]],
  },
  mouse: {
    name:"Keyboard", title:"Mouse disconnected!", intro:"Mom thought RayRay was playing too much and took the mouse. How can he select a file with a keyboard?",
    options:[["Use Tab, then Enter","Tab selects the file. Enter opens it. Keyboard mode ready.",true],["Press Ctrl+Z","Undo does not select files."],["Press Esc","Escape closes this window instead."]],
  },
};
const dialog = document.querySelector("dialog");
const actions = document.querySelector(".actions");
const feedback = document.getElementById("feedback");
const status = document.getElementById("status");
const done = new Set();
let solved = false;

function updateStatus() {
  document.getElementById("lock").textContent = done.size === 3 ? "Unlocked" : "Locked";
  status.textContent = solved ? "Case solved · RayRay was innocent" : done.size + " / 3 tasks done · " + (done.size === 3 ? "Open the exam record" : "Exam record locked");
  for (const [key, task] of Object.entries(tasks)) {
    const badge = document.getElementById("task-" + key);
    badge.classList.toggle("done", done.has(key));
    badge.textContent = (done.has(key) ? "✓ " : "○ ") + task.name;
  }
}

function openFile(key, name) {
  actions.replaceChildren();
  feedback.textContent = "";
  const message = document.getElementById("file-message");
  message.lang = key === "sim" ? "zh-Hant" : "en";
  document.getElementById("translation").hidden = key !== "sim";
  document.getElementById("file-name").textContent = name;
  const task = tasks[key];
  let title, body;
  if (task) {
    title = task.title;
    body = task.intro;
    if (done.has(key)) feedback.textContent = "Task already complete.";
    else for (const [text, response, success] of task.options) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = text;
      button.onclick = () => {
        feedback.textContent = response;
        if (success) {
          done.add(key);
          updateStatus();
          document.querySelector(".close").focus();
          actions.replaceChildren();
        }
      };
      actions.append(button);
    }
  } else if (key === "sim") {
    title = "Wrong file!";
    body = "睿睿你給我過來！";
  } else if (key === "log") {
    title = "Clue found";
    body = "Ctrl+Z did not work. That alone cannot tell you what file was opened. Check the exam record after finishing all three tasks.";
  } else if (done.size < 3) {
    title = "Record locked";
    body = "Finish the laptop, tablet, and keyboard tasks first.";
  } else {
    title = "Case closed";
    body = "The exam record clears him. RayRay was innocent.";
    solved = true;
    updateStatus();
  }
  document.getElementById("file-title").textContent = title;
  message.textContent = body;
  dialog.showModal();
  if (actions.firstElementChild) actions.firstElementChild.focus();
}

for (const button of document.querySelectorAll(".file")) {
  button.addEventListener("click", () => openFile(button.dataset.file, button.querySelector("b").textContent));
}
document.getElementById("reset").addEventListener("click", () => {
  done.clear();
  solved = false;
  updateStatus();
  document.querySelector(".file").focus();
});
updateStatus();
</script>
</html>
